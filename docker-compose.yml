# Local development infrastructure for the HRM platform.
# Host ports (5434, 6380, 9000/9001, 1025/8025) avoid natively installed services and other local
# projects. Override any of them in .env; `pnpm infra:up` verifies every port was actually published.
name: hrm

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-hrm}
      HRM_MIGRATOR_PASSWORD: ${HRM_MIGRATOR_PASSWORD:-migrator_dev_only}
      HRM_APP_PASSWORD: ${HRM_APP_PASSWORD:-app_dev_only}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    # BullMQ requires `noeviction`; AOF persistence keeps queued jobs across restarts.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_only}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_dev_only}
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (replaces MinIO, whose public images are no longer published).
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    security_opt:
      - 'no-new-privileges:true'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-hrm_storage_dev}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-hrm_storage_dev_secret}
    ports:
      - '${STORAGE_HOST_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${SMTP_HOST_PORT:-1025}:1025'
      - '${MAILPIT_UI_HOST_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  storage-data:

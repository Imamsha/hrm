packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions. Packages reference `catalog:`.
catalog:
  typescript: 6.0.3
  eslint: 10.15.0
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
  '@types/node': 22.20.5
  zod: 4.6.7
  decimal.js: 10.6.0
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@tanstack/react-query': 5.105.1
  zustand: 5.0.16

# Supply-chain hardening: only explicitly approved packages may run install scripts.
# Telemetry-only postinstall scripts are denied.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  msgpackr-extract: true
  prisma: true
